name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Отримуємо код ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Встановлюємо Java 17 (використовуємо нову версію) ──
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Налаштовуємо Gradle (без setup-android) ────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── 4. Збираємо APK ───────────────────────────────────────
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      # ── 5. Знаходимо та перейменовуємо APK ────────────────────
      - name: Find & rename APK
        id: find_apk
        run: |
          APK_SRC=$(find android -name "*.apk" | head -1)
          if [ -z "$APK_SRC" ]; then echo "APK not found"; exit 1; fi
          APK_OUT="app-debug-$(date +%Y%m%d-%H%M%S).apk"
          cp "$APK_SRC" "$APK_OUT"
          echo "apk_path=$APK_OUT" >> $GITHUB_OUTPUT
          ls -lh "$APK_OUT"

      # ── 6. Завантажуємо APK як артефакт ───────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error
